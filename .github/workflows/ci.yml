name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Tests & RuboCop (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run main test suite (examples, unit, integration, solutions, case studies 01-04)
        run: bundle exec rake test

      - name: Run static analysis (RuboCop)
        run: bundle exec rubocop

  rest_api:
    name: REST API Suite (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: case_studies/05_rest_api
          bundler-cache: true

      - name: Run REST API integration tests
        working-directory: case_studies/05_rest_api
        run: bundle exec rake test

